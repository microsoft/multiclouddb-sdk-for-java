openapi: 3.1.0
info:
  title: CloudDB SDK Portable Contract (Conceptual)
  version: 0.1.0
  description: |
    This OpenAPI document is a technology-agnostic CONTRACT describing the CloudDB SDK portable operations.

    Note: CloudDB is a client SDK, not an HTTP service. This contract models SDK calls as request/response
    shapes to enable conformance testing across providers and future language implementations.

servers: []

paths:
  /create:
    post:
      operationId: create
      summary: Insert a new item/row by key. Fails if the item already exists.
      description: |
        Shared preflight rejects a null document; top-level `id`,
        `partitionKey`, `sortKey`, `ttl`, `ttlExpiry`, and `data`
        case-insensitively; every underscore-prefixed top-level name;
        binary values and portable-limit violations before provider I/O. The
        top-level map is snapshotted and nested values undergo bounded
        SDK-owned Jackson serialization during shared preflight.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudDbError'

  /read:
    post:
      operationId: read
      summary: Read one item/row by key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudDbError'

  /update:
    post:
      operationId: update
      x-required-capability: partial_update
      summary: Shallow-update selected top-level fields on an existing item/row; fails if absent.
      description: |
        Performs one atomic native shallow set/replace on providers advertising
        PARTIAL_UPDATE. It never creates a missing item and does not accept TTL.

      x-portable-result-envelope:
        $ref: '#/components/schemas/PartialUpdateResultEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NonUnsupportedCapabilityError'
                  - $ref: '#/components/schemas/UnsupportedCapabilityError'

  /upsert:
    post:
      operationId: upsert
      summary: Create or replace an item/row by key.
      description: |
        Create-or-full-replace. This is not an atomic replace-if-present
        operation, and the release has no exact portable atomic equivalent.
        Shared write preflight validation is identical to create.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudDbError'

  /delete:
    post:
      operationId: delete
      summary: Delete one item/row by key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudDbError'

  /query:
    post:
      operationId: query
      summary: Execute a read query with paging.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudDbError'

components:
  schemas:
    ProviderId:
      type: string
      enum: [cosmos, dynamo, spanner]

    ResourceAddress:
      type: object
      required: [database, collection]
      properties:
        database:
          type: string
        collection:
          type: string

    Key:
      type: object
      required: [partitionKey]
      properties:
        partitionKey:
          type: string
          description: The distribution/hash key that determines data placement.
        sortKey:
          type: string
          description: The item identifier/range key within a partition.
        components:
          description: Composite key components when required by the provider.

    Document:
      type: object
      description: |
        Provider-neutral JSON object. Write callers may supply Jackson JsonNode,
        serializable POJO, Java array, map, list, and scalar values that can be
        serialized with the SDK-owned Jackson configuration.
      additionalProperties: true

    OperationOptions:
      type: object
      properties:
        timeout_ms:
          type: integer
          minimum: 1
        cancellation_token:
          type: string
          description: Conceptual cancellation token identifier.
        retry_policy:
          type: object
          description: Portable retry policy configuration.
        ttlSeconds:
          type: [integer, 'null']
          minimum: 1
          description: |
            TTL in seconds for create/upsert only. Providers without
            ROW_LEVEL_TTL ignore this value and store the document without
            expiry; callers requiring expiry must inspect the capability first.
            update() rejects a non-null value before provider I/O.
        includeMetadata:
          type: boolean
          default: false
          description: When true, read operations request DocumentMetadata.

    CreateRequest:
      type: object
      required: [provider, resource, key, document]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderId'
        resource:
          $ref: '#/components/schemas/ResourceAddress'
        key:
          $ref: '#/components/schemas/Key'
        document:
          allOf:
            - $ref: '#/components/schemas/Document'
          description: |
            Non-null complete document. Top-level `id`, `partitionKey`,
            `sortKey`, `ttl`, `ttlExpiry`, and `data` are reserved
            case-insensitively; every underscore-prefixed top-level name is also
            reserved. Remaining top-level names must be unique ignoring case and
            contain at most 128 Unicode characters; nested names are limited to
            50,000 UTF-8 bytes. Binary values, including values exposed while
            serializing a POJO, are rejected before provider I/O. Serialized
            input and structural footprint are independently limited to 390 KiB,
            with at most 31 map/list containers below the document root.

        options:
          $ref: '#/components/schemas/OperationOptions'

    CreateResponse:
      type: object

    ReadRequest:
      type: object
      required: [provider, resource, key]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderId'
        resource:
          $ref: '#/components/schemas/ResourceAddress'
        key:
          $ref: '#/components/schemas/Key'
        options:
          $ref: '#/components/schemas/OperationOptions'

    ReadResponse:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/Document'
        found:
          type: boolean
        metadata:
          anyOf:
            - $ref: '#/components/schemas/DocumentMetadata'
            - type: 'null'
          description: |
            Null when metadata was not requested. With includeMetadata=true,
            the envelope is present and lastModified, ttlExpiry, and version
            are independently nullable.


    UpdateRequest:
      type: object
      description: Portable shallow partial update; not a complete-document replacement.
      required: [provider, resource, key, fields]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderId'
        resource:
          $ref: '#/components/schemas/ResourceAddress'
        key:
          $ref: '#/components/schemas/Key'
        fields:
          type: object
          description: |
            Literal top-level fields to set or replace. Names are field names, not
            paths. Omitted fields remain unchanged. A map or list replaces the
            complete named top-level value rather than being recursively merged. A
            null value stores provider-native null. Values must be serializable with
            the SDK-owned Jackson configuration used by bounded shared preflight.
            Names, including nested map keys, are limited to 50,000 UTF-8 bytes.
            The names id, partitionKey, sortKey, ttl, ttlExpiry, and data are
            reserved case-insensitively, and underscore-prefixed names are invalid.
            Non-reserved case-distinct names such as foo and Foo are valid separate
            literal fields in the same request. Binary values, including values
            hidden in POJOs, are not portable. Replacement values may contain at
            most 31 nested map/list containers. Serialized UTF-8 input and
            structural footprint are separate 390 KiB limits.
          minProperties: 1
          maxProperties: 10
          additionalProperties: true

        options:
          allOf:
            - $ref: '#/components/schemas/OperationOptions'
            - type: object
              properties:
                ttlSeconds:
                  type: 'null'
          description: update() requires ttlSeconds to be null.

    UpdateResponse:
      type: object
      description: |
        Operation acknowledgement. The resulting logical document is within the
        portable base only when its serialized JSON and structural footprint are
        each at most 390 KiB. A state-dependent result above either bound is
        outside this release's portable contract and may succeed or fail under
        native provider limits. TTL timing is outside the portable contract;
        callers requiring fixed absolute expiry must not update TTL-bearing items.
      x-portable-result-envelope:
        $ref: '#/components/schemas/PartialUpdateResultEnvelope'

    UpsertRequest:
      type: object
      required: [provider, resource, key, document]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderId'
        resource:
          $ref: '#/components/schemas/ResourceAddress'
        key:
          $ref: '#/components/schemas/Key'
        document:
          allOf:
            - $ref: '#/components/schemas/Document'
          description: |
            Non-null complete replacement document. Top-level `id`,
            `partitionKey`, `sortKey`, `ttl`, `ttlExpiry`, and `data` are reserved
            case-insensitively; every underscore-prefixed top-level name is also
            reserved. Remaining top-level names must be unique ignoring case and
            contain at most 128 Unicode characters; nested names are limited to
            50,000 UTF-8 bytes. Binary values, including values exposed while
            serializing a POJO, are rejected before provider I/O. Serialized
            input and structural footprint are independently limited to 390 KiB,
            with at most 31 map/list containers below the document root.

        options:
          $ref: '#/components/schemas/OperationOptions'

    UpsertResponse:
      type: object

    DeleteRequest:
      type: object
      required: [provider, resource, key]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderId'
        resource:
          $ref: '#/components/schemas/ResourceAddress'
        key:
          $ref: '#/components/schemas/Key'
        options:
          $ref: '#/components/schemas/OperationOptions'

    DeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean

    QueryRequest:
      type: object
      required: [provider, resource]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderId'
        resource:
          $ref: '#/components/schemas/ResourceAddress'
        query:
          type: object
          properties:
            expression:
              type: string
              description: |
                Portable query expression using SQL-subset WHERE clause syntax.
                Supports operators: =, <>, <, >, <=, >=, AND, OR, NOT, IN, BETWEEN.
                Named parameters use @paramName syntax.
                Portable functions: starts_with, contains, field_exists, string_length, collection_size.
                Mutually exclusive with native_expression.
                When both expression and native_expression are null/empty, returns all items (full scan).
            native_expression:
              type: string
              description: |
                Provider-specific expression passed through without translation.
                Mutually exclusive with expression. When set, the expression is sent
                directly to the provider's native query API.
            target_provider:
              $ref: '#/components/schemas/ProviderId'
              description: |
                Optional hint for native_expression indicating which provider's syntax is used.
                The SDK uses this to validate that the native expression matches the active provider.
            parameters:
              type: object
              additionalProperties: true
              description: |
                Named parameter values. Keys correspond to @paramName references in the expression.
                For portable expressions, the SDK translates these to provider-specific parameter formats.
            page_size:
              type: integer
              minimum: 1
            continuation_token:
              type: string
            partitionKey:
              type: [string, 'null']
              description: |
                Optional partition-key value for provider-native query scoping.
                Null means the query is not restricted to one partition.
            limit:
              type: [integer, 'null']
              minimum: 1
              description: |
                Maximum number of matching items to return (Top N), applied
                after filtering and partition scoping. Null means no limit.
            orderBy:
              type: array
              items:
                $ref: '#/components/schemas/SortOrder'
              description: |
                Zero or more sort specifications. Empty means no ordering.
                ORDER BY is capability-gated and unsupported requests fail
                before query execution.
        options:
          $ref: '#/components/schemas/OperationOptions'

    QueryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        continuation_token:
          type: string


    CloudDbError:
      type: object
      required: [category, message, provider, operation, retryable]
      properties:
        category:
          type: string
          enum:
            - InvalidRequest
            - AuthenticationFailed
            - AuthorizationFailed
            - NotFound
            - Conflict
            - Throttled
            - TransientFailure
            - PermanentFailure
            - ProviderError
            - UnsupportedCapability
        message:
          type: string
        provider:
          anyOf:
            - $ref: '#/components/schemas/ProviderId'
            - type: 'null'
          description: Null for shared preflight failures that occur before provider I/O.
        operation:
          type: string
        retryable:
          type: boolean
        provider_details:
          type: object
          additionalProperties: true

    NonUnsupportedCapabilityError:
      description: |
        Generic update error branch. UnsupportedCapability is excluded so the
        specialized branch can enforce its provider_details requirements.
      allOf:
        - $ref: '#/components/schemas/CloudDbError'
        - type: object
          properties:
            category:
              not:
                const: UnsupportedCapability

    UnsupportedCapabilityError:
      description: |
        Non-retryable CloudDbError specialization for a failed capability gate
        or a state-dependent native result-envelope rejection.
      allOf:
        - $ref: '#/components/schemas/CloudDbError'
        - type: object
          required: [provider_details]
          properties:
            category:
              const: UnsupportedCapability
            retryable:
              const: false
            provider_details:
              type: object
              properties:
                capability:
                  type: string
                  description: Required capability name for a shared pre-I/O gate.
                  examples:
                    - partial_update
                reason:
                  type: string
                  description: Stable provider-limit reason after one attempted native update.
              anyOf:
                - required: [capability]
                - required: [reason]
              additionalProperties: true

    ExpressionValidationError:
      type: object
      description: |
        Returned when a portable expression fails validation before execution.
        This is a sub-type of CloudDbError with category InvalidRequest.
      required: [category, message, provider, operation, retryable, validation_details]
      properties:
        category:
          type: string
          enum: [InvalidRequest]
        message:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderId'
        operation:
          type: string
          enum: [query]
        retryable:
          type: boolean
          enum: [false]
        validation_details:
          type: object
          properties:
            error_type:
              type: string
              enum:
                - UNSUPPORTED_FUNCTION
                - UNSUPPORTED_OPERATOR
                - MISSING_PARAMETER
                - MALFORMED_SYNTAX
                - UNSUPPORTED_CAPABILITY
            expression:
              type: string
              description: The original portable expression that failed validation.
            position:
              type: integer
              description: Character position in the expression where the error was detected.
            details:
              type: string
              description: Human-readable details about the validation failure.

    QueryCapability:
      type: object
      description: |
        Represents a query-related capability that a provider may or may not support.
      required: [name, supported]
      properties:
        name:
          type: string
          enum:
            - PORTABLE_QUERY_EXPRESSION
            - LIKE_OPERATOR
            - ORDER_BY
            - ENDS_WITH
            - REGEX_MATCH
            - CASE_FUNCTIONS
        supported:
          type: boolean
        notes:
          type: string

    Feature002CapabilityName:
      type: string
      description: Canonical capability name introduced by the portable partial-update contract.
      enum:
        - partial_update
      examples:
        - partial_update

# =============================================================================
# Issue 25 API Delta: Result Set Control, TTL/Write Metadata, Document Size
# =============================================================================

    SortDirection:
      type: string
      enum: [ASC, DESC]
      description: Sort direction for ORDER BY clauses (FR-050).

    SortOrder:
      type: object
      required: [field, direction]
      properties:
        field:
          type: string
          minLength: 1
          description: Name of the field to sort on.
        direction:
          $ref: '#/components/schemas/SortDirection'

    DocumentMetadata:
      type: object
      description: |
        System-managed properties returned alongside a document when
        OperationOptions.includeMetadata is true (FR-058). The envelope is
        present when requested, and each field is independently nullable.
      properties:
        lastModified:
          type: [string, 'null']
          format: date-time
          description: Last write timestamp (Cosmos via _ts; unavailable on current DynamoDB and Spanner providers).
        ttlExpiry:
          type: [string, 'null']
          format: date-time
          description: TTL expiry timestamp (DynamoDB via ttlExpiry attribute; unavailable on current Cosmos and Spanner providers).
        version:
          type: [string, 'null']
          description: Provider-native version/ETag string (Cosmos ETag; others null).

    PartialUpdateResultEnvelope:
      type: object
      description: |
        Contract metadata for the resulting logical document. Serialized UTF-8
        JSON size and provider-neutral structural footprint are independent.
        Portable behavior is guaranteed only when both measures are at or below
        their maxima. State-dependent results above either maximum are outside
        this release's portable contract. TTL timing is not represented here.
      required:
        - maxSerializedResultBytes
        - maxStructuralResultBytes
      properties:
        maxSerializedResultBytes:
          type: integer
          const: 399360
        maxStructuralResultBytes:
          type: integer
          const: 399360
      additionalProperties: false

  x-capability-additions-issue25:
    ROW_LEVEL_TTL:
      name: row_level_ttl
      description: Provider supports per-document time-to-live expiry.
      supported_by: [cosmos, dynamo]
      unsupported_by: [spanner]
    WRITE_TIMESTAMP:
      name: write_timestamp
      description: |
        Provider may populate DocumentMetadata.lastModified. This capability
        does not gate the metadata envelope or other metadata fields.
      supported_by: [cosmos]
      unsupported_by: [dynamo, spanner]
    RESULT_LIMIT:
      name: result_limit
      description: Provider supports Top N result capping in queries.
      supported_by: [cosmos, dynamo, spanner]

  x-capability-additions-feature002:
    PARTIAL_UPDATE:
      name: partial_update
      description: |
        Capability-gated portable shallow literal top-level set/replace with at
        most 10 fields, no TTL, NOT_FOUND for a missing item, and one native
        atomic write. Portable behavior is guaranteed only when the resulting
        logical document's serialized JSON and structural footprint are each at
        most 390 KiB. TTL timing is outside the portable contract.
      supported_by: [cosmos, dynamo]
      unsupported_by: [spanner]
      omitted_declaration_default: unsupported
      unsupported_error:
        $ref: '#/components/schemas/UnsupportedCapabilityError'

  x-capabilityset-feature002-normalization:
    unsupported_defaults:
      - partial_update
    built_in_effective_rows: 18
    synthesize_unrelated_omissions: false
