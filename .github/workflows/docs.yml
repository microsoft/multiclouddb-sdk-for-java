name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN. The gh-deploy push authenticates with a separate
# PAT (PAGES_DEPLOY_TOKEN) and checkout runs with persist-credentials: false, so
# the default token is only used to read the repo during checkout.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Configure git credentials
        run: git remote set-url origin https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/${{ github.repository }}

      - name: Build and deploy
        run: mkdocs gh-deploy --force
