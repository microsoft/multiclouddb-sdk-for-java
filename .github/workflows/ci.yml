name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN for all jobs. This workflow only checks out the
# repo, runs the Maven build, and uploads workflow artifacts (which does not need
# a token scope) - it never writes back to the repository - so read-only access
# to contents is sufficient.
permissions:
  contents: read

jobs:
  build:
    name: Build, Unit Tests & Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run unit tests
        run: mvn verify -Punit

      - name: Stage release artifacts
        run: |
          mvn deploy -DskipTests \
            -DaltDeploymentRepository=local::default::file://${{ github.workspace }}/staging

      - name: Verify required artifacts
        run: |
          # Modules that produce .pom + .jar + -sources.jar + -javadoc.jar
          FULL_MODULES="multiclouddb-api multiclouddb-provider-cosmos multiclouddb-provider-dynamo multiclouddb-provider-spanner"
          ERRORS=0

          check_artifact() {
            local module=$1 type=$2 path=$3
            if [ -z "$path" ]; then
              echo "::error::Missing ${module} ${type} artifact"
              ERRORS=$((ERRORS + 1))
            else
              echo "  ✓ ${type}: $(basename "$path")"
            fi
          }

          for module in $FULL_MODULES; do
            echo "--- Checking $module (full) ---"
            check_artifact "$module" pom    "$(find staging -path "*/${module}/*.pom" 2>/dev/null | head -1)"
            check_artifact "$module" jar    "$(find staging -path "*/${module}/*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" 2>/dev/null | head -1)"
            check_artifact "$module" sources "$(find staging -path "*/${module}/*-sources.jar" 2>/dev/null | head -1)"
            check_artifact "$module" javadoc "$(find staging -path "*/${module}/*-javadoc.jar" 2>/dev/null | head -1)"
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::${ERRORS} required artifact(s) missing"
            exit 1
          fi
          echo ""
          echo "All required artifacts verified successfully"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: staging/
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/surefire-reports/**'
          retention-days: 7

  emulator-cosmos:
    name: Cosmos DB Emulator Tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Start Azure Cosmos DB Emulator
        shell: pwsh
        run: |
          Write-Host "Launching Azure Cosmos DB Emulator"
          $Emulator = "$env:ProgramFiles\Azure Cosmos DB Emulator\Microsoft.Azure.Cosmos.Emulator.exe"

          if (!(Test-Path $Emulator)) {
            Write-Error "Emulator not found at '$Emulator'"
            exit 1
          }

          # Match Java/Python SDK emulator parameters:
          #   /noexplorer   - skip data explorer UI
          #   /noui         - no system tray icon
          #   /enablepreview - enable preview features
          #   /disableratelimiting - prevent 429s during tests
          #   /partitioncount=50  - more realistic partition layout
          #   /consistency=Session - Cosmos DB default consistency
          $startArgs = "/noexplorer /noui /enablepreview /disableratelimiting /partitioncount=50 /consistency=Session"
          Write-Host "Starting emulator: $Emulator $startArgs"
          $process = Start-Process $Emulator -ArgumentList $startArgs -ErrorAction Stop -PassThru
          Write-Host "Emulator process started: PID=$($process.Id)"

          # Poll /getstatus until running (exit code 2) or timeout
          # Matches the approach used by azure-sdk-for-java and azure-sdk-for-python
          $Timeout = 600
          $start = [DateTimeOffset]::Now
          $stop = $start.AddSeconds($Timeout)
          do {
            $status = Start-Process $Emulator -ArgumentList "/getstatus" -PassThru -Wait
            switch ($status.ExitCode) {
              1 { Write-Host "Emulator is starting..." }
              2 {
                Write-Host "Cosmos DB Emulator is running"
                break
              }
              3 { Write-Host "Emulator is stopped" }
              default { Write-Host "Unrecognized status exit code: $($status.ExitCode)" }
            }
            if ($status.ExitCode -eq 2) { break }
            Start-Sleep -Seconds 5
          } while ([DateTimeOffset]::Now -lt $stop)

          if ($status.ExitCode -ne 2) {
            Write-Error "Emulator failed to reach Running status within $Timeout seconds"
            exit 1
          }

      - name: Cosmos emulator diagnostics (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -match "Cosmos|DocumentDB" } | Format-Table -AutoSize
          Get-Service | Where-Object { $_.Name -match "Cosmos|DocumentDB" } | Format-Table -AutoSize
          Test-NetConnection localhost -Port 8081 | Format-List

      - name: Import Cosmos DB Emulator certificate into JDK truststore
        shell: pwsh
        run: |
          # The Cosmos DB Emulator uses a two-cert chain:
          #   Root CA  → stored in Cert:\LocalMachine\Root (FriendlyName: DocumentDbEmulatorCertificate)
          #   Leaf cert → stored in Cert:\LocalMachine\My  (Subject: CN=localhost), signed by Root CA
          # Java must trust the ROOT CA, not the leaf cert.
          # Importing only the leaf cert causes "signature check failed" because the
          # leaf is not self-signed — its issuer (the Root CA) is not in the truststore.
          $certFile = "$env:TEMP\cosmos-emulator-root.cer"
          $keystore  = "$env:JAVA_HOME\lib\security\cacerts"
          $keytool   = "$env:JAVA_HOME\bin\keytool.exe"

          Write-Host "Waiting for emulator Root CA in Cert:\LocalMachine\Root ..."
          $deadline = (Get-Date).AddSeconds(60)
          $cert = $null
          while (-not $cert -and (Get-Date) -lt $deadline) {
              $cert = Get-ChildItem Cert:\LocalMachine\Root | Where-Object {
                  $_.FriendlyName -like "*DocumentDb*" -or
                  $_.FriendlyName -like "*CosmosDb*"   -or
                  $_.Subject       -like "*DocumentDb*"
              } | Select-Object -First 1
              if (-not $cert) { Start-Sleep -Seconds 3 }
          }

          if (-not $cert) {
              Write-Host "Root store contents:"
              Get-ChildItem Cert:\LocalMachine\Root | Select-Object Subject, FriendlyName | Format-Table
              Write-Host "My store contents:"
              Get-ChildItem Cert:\LocalMachine\My   | Select-Object Subject, FriendlyName | Format-Table
              Write-Error "Cosmos DB emulator Root CA not found after 60 s"
              exit 1
          }

          Write-Host "Found Root CA: Subject=$($cert.Subject) FriendlyName=$($cert.FriendlyName)"
          Export-Certificate -Cert $cert -FilePath $certFile -Type CERT
          Write-Host "Exported to $certFile"

          & $keytool -importcert -noprompt -trustcacerts `
              -alias CosmosDbEmulatorRootCA `
              -file $certFile `
              -keystore $keystore `
              -storepass changeit
          Write-Host "Root CA imported into JDK truststore successfully"

      - name: Create test database and container
        shell: pwsh
        run: |
          $masterKey = "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="
          $endpoint  = "https://localhost:8081"

          function Get-CosmosAuthHeader([string]$verb, [string]$resourceType, [string]$resourceLink, [string]$date, [string]$key) {
              $keyBytes = [System.Convert]::FromBase64String($key)
              $text     = "$($verb.ToLowerInvariant())`n$($resourceType.ToLowerInvariant())`n$resourceLink`n$($date.ToLowerInvariant())`n`n"
              $hmac     = New-Object System.Security.Cryptography.HMACSHA256
              $hmac.Key = $keyBytes
              $sig      = [System.Convert]::ToBase64String($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($text)))
              return [uri]::EscapeDataString("type=master&ver=1.0&sig=$sig")
          }

          function Invoke-CosmosApi([string]$verb, [string]$url, [string]$resourceType, [string]$resourceLink, [string]$body) {
              $date    = [DateTime]::UtcNow.ToString("r")
              $auth    = Get-CosmosAuthHeader $verb $resourceType $resourceLink $date $masterKey
              $headers = @{ "Authorization" = $auth; "x-ms-date" = $date; "x-ms-version" = "2018-12-31" }
              try {
                  Invoke-RestMethod -Uri $url -Method $verb -Headers $headers -Body $body `
                      -ContentType "application/json" -SkipCertificateCheck
                  Write-Host "  Created successfully"
              } catch {
                  if ($_.Exception.Response.StatusCode.value__ -eq 409) {
                      Write-Host "  Already exists (409) - OK"
                  } else { throw }
              }
          }

          Write-Host "Creating database 'todoapp'..."
          Invoke-CosmosApi "POST" "$endpoint/dbs" "dbs" "" '{"id":"todoapp"}'

          Write-Host "Creating container 'todos' (partition key: /partitionKey)..."
          Invoke-CosmosApi "POST" "$endpoint/dbs/todoapp/colls" "colls" "dbs/todoapp" `
              '{"id":"todos","partitionKey":{"paths":["/partitionKey"],"kind":"Hash","Version":2}}'

          Write-Host "Test database and container are ready"

      - name: Run Cosmos DB integration tests
        shell: bash
        run: |
          mvn verify -Pemulator-cosmos -pl multiclouddb-conformance -am \
            -Djunit.jupiter.execution.timeout.default=20s

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-test-reports
          path: '**/surefire-reports/**'
          retention-days: 7

  emulator-dynamo:
    name: DynamoDB Local Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Start DynamoDB Local
        run: |
          # Pull with retry + exponential backoff to handle Docker Hub rate limits
          IMAGE="amazon/dynamodb-local:2.5.3"
          for i in 1 2 3 4 5; do
            echo "Attempt $i: pulling $IMAGE..."
            if docker pull "$IMAGE" 2>&1; then
              echo "Pull succeeded"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "::error::Failed to pull $IMAGE after 5 attempts"
              exit 1
            fi
            WAIT=$((i * 15))
            echo "Pull failed, waiting ${WAIT}s before retry..."
            sleep "$WAIT"
          done
          docker run -d --name dynamodb-local -p 8000:8000 "$IMAGE"

      - name: Wait for DynamoDB Local
        run: |
          echo "Waiting for DynamoDB Local to be ready..."
          timeout 60 bash -c '
            until curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 2>/dev/null | grep -q "400\|200"; do
              echo "  Not ready yet, retrying in 2s..."
              sleep 2
            done
          '
          echo "DynamoDB Local is ready"

      - name: Run DynamoDB integration tests
        run: |
          mvn verify -Pemulator-dynamo -pl multiclouddb-conformance -am \
            -Djunit.jupiter.execution.timeout.default=20s

      - name: Stop DynamoDB Local
        if: always()
        run: docker rm -f dynamodb-local 2>/dev/null || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamo-test-reports
          path: '**/surefire-reports/**'
          retention-days: 7

  emulator-spanner:
    name: Spanner Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Start Spanner Emulator
        run: |
          IMAGE="gcr.io/cloud-spanner-emulator/emulator:1.5.29"
          for i in 1 2 3 4 5; do
            echo "Attempt $i: pulling $IMAGE..."
            if docker pull "$IMAGE" 2>&1; then
              echo "Pull succeeded"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "::error::Failed to pull $IMAGE after 5 attempts"
              exit 1
            fi
            # Exponential backoff: 15s, 30s, 60s, 120s between attempts.
            WAIT=$((15 * (1 << (i - 1))))
            echo "Pull failed, waiting ${WAIT}s before retry..."
            sleep "$WAIT"
          done
          docker run -d --name spanner-emulator \
            -p 9010:9010 \
            -p 9020:9020 \
            "$IMAGE"

      - name: Wait for Spanner Emulator
        run: |
          echo "Waiting for Spanner Emulator to be ready..."
          # Probe instanceConfigs — the emulator pre-populates this list, so it
          # returns HTTP 200 once the REST/gRPC stack is up and does not depend
          # on any user-created project/instance.
          timeout 60 bash -c '
            until curl -fsS http://localhost:9020/v1/projects/test-project/instanceConfigs >/dev/null 2>&1; do
              echo "  Not ready yet, retrying in 2s..."
              sleep 2
            done
          '
          echo "Spanner Emulator is ready (gRPC :9010, REST :9020)"

      - name: Run Spanner integration tests
        run: |
          mvn verify -Pemulator-spanner -pl multiclouddb-conformance -am \
            -Djunit.jupiter.execution.timeout.default=20s

      - name: Spanner emulator diagnostics (on failure)
        if: failure()
        run: |
          docker ps -a
          docker logs spanner-emulator || true

      - name: Stop Spanner Emulator
        if: always()
        run: docker rm -f spanner-emulator 2>/dev/null || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spanner-test-reports
          path: '**/surefire-reports/**'
          retention-days: 7
